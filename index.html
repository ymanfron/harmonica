    "No blues as colcheias quase nunca são iguais. A primeira é longa e a segunda, curta: “**tum**-ta **tum**-ta”. Isso é o **shuffle**, também chamado de swing.",
    "A conta por trás é a tercina: divida o tempo em três e toque só a primeira e a terceira parte. A do meio fica em silêncio.",
    "Ouça os dois lado a lado. A diferença é pequena no papel e enorme no som:",
    W('ritmo',{p:'colcheias'}), W('ritmo',{p:'shuffle'}),
    G("Juke, Roadhouse Blues e quase todo blues de gaita são tocados em shuffle. Se a frase está certa nas notas e ainda soa “dura”, o problema costuma ser tocar as colcheias retas.") ],
    q:[ Q("O shuffle é baseado em qual subdivisão?",["Colcheias iguais","Tercinas","Semicolcheias"],1,"Primeira e terceira nota da tercina."),
        Q("No shuffle, qual colcheia é mais longa?",["A primeira","A segunda","As duas são iguais"],0,"Longa-curta: a primeira ocupa dois terços do tempo.") ] },
  { id:'2.7', t:'Ponto, ligadura e anacruse', c:[
    "O **ponto de aumento** depois de uma figura soma a ela metade do seu valor. Uma mínima pontuada vale 3 tempos (2 + 1); uma semínima pontuada, um tempo e meio.",
    "A **ligadura** une duas notas de mesma altura: você toca a primeira e segura pelo tempo das duas. É assim que se escreve uma nota que atravessa a barra do compasso.",
    "**Anacruse** é quando a melodia começa antes do primeiro tempo forte. Muitas músicas entram assim: uma ou duas notas “de impulso” e só depois cai o tempo 1.",
    G("Conte em voz alta um compasso inteiro antes de entrar. Se a música começa em anacruse, você precisa saber em que tempo a primeira nota cai.") ],
    q:[ Q("Quanto vale uma semínima pontuada?",["1 tempo","1 tempo e meio","2 tempos"],1,"O ponto acrescenta metade: 1 + ½."),
        Q("Uma melodia que começa antes do primeiro tempo forte começa em…",["síncope","anacruse","contratempo"],1,"Anacruse é a entrada antes do tempo 1.") ] }
]},
{ id:'m3', t:'Intervalos', d:'A distância entre duas notas, base de escalas e acordes.', l:[
  { id:'3.1', t:'O que é um intervalo', c:[
    "**Intervalo** é a distância entre duas notas. Tocadas uma depois da outra, formam um intervalo **melódico**; tocadas juntas, um intervalo **harmônico**.",
    "O nome do intervalo vem de contar as letras, incluindo a primeira e a última. De C a E são três letras (C, D, E): é uma **terça**. De C a G são cinco: uma **quinta**.",
    "Essa contagem dá o número. Para saber o tamanho exato, contam-se os semitons, assunto da próxima lição.",
    G("Toda melodia é uma sequência de intervalos. Quando você transpõe uma música para outra gaita, as notas mudam, mas os intervalos ficam idênticos.") ],
    q:[ Q("De D a A, contando as letras, o intervalo é uma…",["quarta","quinta","sexta"],1,"D, E, F, G, A: cinco letras."),
        Q("Duas notas tocadas ao mesmo tempo formam um intervalo…",["melódico","harmônico"],1,"Juntas = harmônico. Em sequência = melódico.") ] },
  { id:'3.2', t:'Maiores, menores e justos', c:[
    "O número sozinho não basta: C–E e C–Eb são ambos terças, mas soam diferentes. A **qualidade** resolve isso.",
    U(["**Segundas, terças, sextas e sétimas** podem ser **maiores** ou **menores**. A menor tem um semitom a menos.","**Quartas, quintas e oitavas** são **justas**.","Um semitom acima do justo ou do maior é **aumentado**; um abaixo do justo ou do menor é **diminuto**."]),
    "A tabela mostra todos os intervalos a partir da tônica escolhida no topo. Toque cada um e tente guardar o som:",
    W('intervalos'),
    "A terça é a que mais importa por enquanto: **terça maior** (4 semitons) soa aberta e alegre; **terça menor** (3 semitons) soa fechada e triste. É ela que decide se um acorde é maior ou menor." ],
    q:[ Q("Quantos semitons tem uma terça maior?",["3","4","5"],1,"Terça maior: 4 semitons. Terça menor: 3."),
        Q("A quinta justa tem quantos semitons?",["5","6","7"],2,"Quinta justa = 7 semitons (C a G)."),
        Q("Qual desses intervalos é chamado de justo?",["Terça","Quarta","Sexta"],1,"Quarta, quinta e oitava são justas.") ] },
  { id:'3.3', t:'Tensão, repouso e inversão', c:[
    "Alguns intervalos soam estáveis (**consonantes**): oitava, quinta, terças e sextas. Outros pedem movimento (**dissonantes**): segundas, sétimas e o trítono.",
    "O **trítono** tem 6 semitons, exatamente meia oitava. É o intervalo mais instável e o motor da harmonia: dentro do acorde G7 ele aparece entre B e F, e é essa tensão que faz o G7 querer resolver em C.",
    "**Inverter** um intervalo é passar a nota de baixo para cima. Os números sempre somam 9, e a qualidade troca: terça maior vira sexta menor, segunda menor vira sétima maior. O justo continua justo: a quinta vira quarta.",
    W('ouvirTritono') ],
    q:[ Q("Invertendo uma terça maior, o resultado é uma…",["sexta menor","sexta maior","quinta justa"],0,"3 + 6 = 9, e maior vira menor."),
        Q("Quantos semitons tem o trítono?",["5","6","7"],1,"Seis semitons, metade da oitava.") ] },
  { id:'3.4', t:'Treino de ouvido', c:[
    "Reconhecer intervalos de ouvido é o que permite tirar música sem tablatura. Não é dom: é repetição.",
    "O jogo toca duas notas a partir da tônica escolhida. Cante as duas antes de responder; quem canta o intervalo aprende muito mais rápido do que quem só ouve.",
    W('ouvido'),
    G("Depois de acertar aqui, ache o mesmo intervalo na gaita. Exemplo na diatônica em C: +4 para +5 é uma terça maior; +4 para +6, uma quinta justa; +4 para +7, uma oitava.") ],
    q:[ Q("Para aprender intervalos mais rápido, o melhor é…",["só ouvir várias vezes","cantar as duas notas","ler sobre o assunto"],1,"Cantar obriga o ouvido a medir a distância.") ] }
]},
{ id:'m4', t:'A escala maior', d:'A régua com que todo o resto é medido.', l:[
  { id:'4.1', t:'A fórmula', c:[
    "**Escala** é uma seleção de notas em ordem, de uma nota até a sua oitava. A escala maior é a referência: todas as outras escalas e todos os acordes são descritos em comparação com ela.",
    "O que define a escala maior é a sequência de distâncias entre as notas:",
    { mono:"tom – tom – semitom – tom – tom – tom – semitom" },
    "Em Dó não aparece nenhum sustenido nem bemol, porque os dois semitons naturais (Mi–Fá e Si–Dó) caem exatamente onde a fórmula pede.",
    W('escala',{tipo:'maior'}),
    G("Na diatônica, a escala maior do tom da gaita sai sem bend do furo 4 ao 7: +4 -4 +5 -5 +6 -6 -7 +7. Repare que do 6 para o 7 a ordem inverte: aspira antes de soprar.") ],
    q:[ Q("Onde ficam os semitons na escala maior?",["Entre os graus 3–4 e 7–8","Entre 2–3 e 5–6","Entre 1–2 e 4–5"],0,"T T st T T T st: o semitom vem depois do 3º e do 7º grau."),
        Q("Quantas notas diferentes tem a escala maior?",["5","7","12"],1,"Sete notas; a oitava repete a primeira.") ] },
  { id:'4.2', t:'Montando em qualquer nota', c:[
    "Para montar a escala maior de qualquer nota, aplique a fórmula a partir dela. Os sustenidos e bemóis aparecem sozinhos, para manter as distâncias certas.",
    "Há uma regra de escrita: **cada letra aparece uma única vez**. Em Sol maior a sétima nota é F#, não Gb, porque a letra G já foi usada na tônica e a letra F ainda não tinha aparecido.",
    "Troque a tônica no topo desta tela e veja a escala se refazer:",
    W('escala',{tipo:'maior'}),
    "Tons com sustenidos nunca misturam bemóis, e vice-versa." ],
    q:[ Q("Qual é a sétima nota de Sol maior?",["F","F#","Gb"],1,"G A B C D E F#. A letra F precisa aparecer, e sobe meio tom."),
        Q("Quantos sustenidos tem Ré maior?",["1","2","3"],1,"D E F# G A B C#: F# e C#.") ] },
  { id:'4.3', t:'Armaduras e o ciclo de quintas', c:[
    "A **armadura** é o conjunto de sustenidos ou bemóis de um tom. Ela segue uma ordem fixa que vale decorar.",
    "Subindo de quinta em quinta a partir de Dó, cada tom ganha **um sustenido**: C (0), G (1), D (2), A (3), E (4), B (5), F# (6). Os sustenidos entram sempre nesta ordem: **F C G D A E B**.",
    "Descendo de quinta em quinta (ou subindo de quarta em quarta), cada tom ganha **um bemol**: F (1), Bb (2), Eb (3), Ab (4), Db (5), Gb (6). Os bemóis entram na ordem inversa: **B E A D G C F**.",
    "Dispostos em círculo, os doze tons formam o **ciclo de quintas**. Tons vizinhos no círculo têm seis notas em comum, e por isso soam próximos. Toque num tom para usá-lo nos exemplos:",
    W('ciclo'),
    G("O ciclo de quintas também explica as posições da gaita: cada passo no sentido horário é uma posição a mais. Gaita em C: 1ª posição toca em C, 2ª em G, 3ª em D, 4ª em A.") ],
    q:[ Q("Qual tom maior tem três sustenidos?",["D","A","E"],1,"C(0) G(1) D(2) A(3). Lá maior: F#, C#, G#."),
        Q("Qual é o primeiro bemol a aparecer?",["Bb","Eb","Ab"],0,"A ordem dos bemóis é B E A D G C F."),
        Q("Fá maior tem…",["um sustenido","um bemol","nenhum acidente"],1,"F G A Bb C D E.") ] },
  { id:'4.4', t:'Graus', c:[
    "Cada nota da escala recebe um número, o **grau**, escrito em algarismo romano. O I é a tônica, e os outros são medidos a partir dela.",
    W('graus'),
    "Três graus sustentam o tom e são chamados de graus tonais: **I (tônica)**, **IV (subdominante)** e **V (dominante)**. O VII é a **sensível**: fica a um semitom da tônica e “pede” para subir até ela.",
    "Pensar em graus é o que torna possível tocar em qualquer tom. “Ir do I para o V” vale igual em Dó (C para G) e em Lá (A para E)." ],
    q:[ Q("Em Lá maior, qual nota é o V grau?",["D","E","F#"],1,"A B C# D E: o quinto grau é Mi."),
        Q("O grau que fica um semitom abaixo da tônica chama-se…",["dominante","mediante","sensível"],2,"O VII grau da escala maior é a sensível.") ] }
]},
{ id:'m5', t:'Escalas menores', d:'A outra metade do sistema tonal.', l:[
  { id:'5.1', t:'A menor natural', c:[
    "A escala menor natural tem outra fórmula:",
    { mono:"tom – semitom – tom – tom – semitom – tom – tom" },
    "Comparando com a maior da mesma nota, três graus descem meio tom: a terça, a sexta e a sétima. Escreve-se **b3, b6, b7**. A terça menor é a que dá o caráter triste.",
    W('escala',{tipo:'menor'}),
    G("Na diatônica, a menor natural sai sem bend na 4ª posição. Na gaita em C é Lá menor: -6 -7 +7 -8 +8 -9 +9 -10.") ],
    q:[ Q("Quais graus são diferentes entre a maior e a menor natural da mesma nota?",["2, 4 e 5","3, 6 e 7","1, 4 e 5"],1,"A menor natural tem b3, b6 e b7."),
        Q("Qual é a terça de Lá menor?",["C","C#","D"],0,"A B C: terça menor, três semitons acima de A.") ] },
  { id:'5.2', t:'Relativas', c:[
    "Toda escala maior tem uma menor com **exatamente as mesmas notas**: a sua **relativa menor**. Ela começa no VI grau da maior, ou, o que dá no mesmo, três semitons abaixo da tônica.",
    W('relativa'),
    "Como as notas são iguais, a armadura é a mesma. O que muda é a nota de repouso: para onde a melodia e os acordes voltam. A mesma coleção de notas soa alegre girando em torno de Dó e melancólica girando em torno de Lá.",
    G("Por isso uma só gaita serve para um tom maior e para o seu relativo menor: a gaita em G toca Sol maior (1ª posição) e Mi menor (4ª posição) com as mesmas notas.") ],
    q:[ Q("Qual é a relativa menor de Dó maior?",["Lá menor","Mi menor","Ré menor"],0,"O VI grau de C é A."),
        Q("Qual é a relativa maior de Mi menor?",["Dó","Sol","Ré"],1,"Três semitons acima de E: G.") ] },
  { id:'5.3', t:'Harmônica e melódica', c:[
    "A menor natural tem um ponto fraco: o VII grau está a um tom da tônica e não puxa de volta com a força da sensível. Duas variações resolvem isso.",
    "A **menor harmônica** sobe o VII grau meio tom. Aparece a sensível, o acorde do V grau vira maior e a escala ganha um salto de um tom e meio entre o 6 e o 7, de som “oriental”.",
    W('escala',{tipo:'menorH'}),
    "A **menor melódica** sobe também o VI grau, para suavizar esse salto. Na tradição clássica ela sobe assim e desce como a menor natural.",
    W('escala',{tipo:'menorM'}),
    "Na prática, uma música em tom menor passeia pelas três. Elas são variações de cor de uma mesma tonalidade, não escalas rivais." ],
    q:[ Q("O que a menor harmônica muda em relação à natural?",["Sobe o VII grau","Desce o II grau","Sobe o III grau"],0,"O sétimo grau sobe meio tom e vira sensível."),
        Q("Em Lá menor harmônica, o acorde do V grau é…",["Em","E","E°"],1,"Com G# no lugar de G, o acorde vira E maior (E G# B).") ] },
  { id:'5.4', t:'Relativa não é homônima', c:[
    "Dois parentescos costumam ser confundidos:",
    U(["**Relativas** têm as mesmas notas e tônicas diferentes: Dó maior e Lá menor.","**Homônimas** (ou paralelas) têm a mesma tônica e notas diferentes: Dó maior e Dó menor."]),
    "Dó menor tem três bemóis (Bb, Eb, Ab) que Dó maior não tem. Trocar um tom pelo seu homônimo no meio da música é um recurso forte: a música “escurece” ou “abre” sem sair do lugar.",
    W('homonimas') ],
    q:[ Q("Dó maior e Dó menor são…",["relativas","homônimas","enarmônicas"],1,"Mesma tônica, notas diferentes: homônimas."),
        Q("Quantas notas diferem entre uma escala maior e a sua homônima menor natural?",["1","2","3"],2,"Os graus 3, 6 e 7.") ] }
]},
{ id:'m6', t:'Acordes', d:'Três ou mais notas soando juntas.', l:[
  { id:'6.1', t:'Tríades', c:[
    "**Acorde** é um grupo de notas tocadas juntas. O acorde básico, a **tríade**, tem três notas empilhadas em terças: a **fundamental**, a **terça** e a **quinta**.",
    "Existem quatro tipos, conforme o tamanho de cada terça:",
    W('triades'),
    "Maior e menor são os que você encontra o tempo todo. A única diferença entre eles é a terça: baixe a terça de um acorde maior meio tom e ele vira menor.",
    G("A diatônica já vem com tríades prontas: soprando três furos vizinhos sai o acorde do tom da gaita.") ],
    q:[ Q("Quais notas formam o acorde de Dó maior?",["C D E","C E G","C F G"],1,"Fundamental, terça e quinta: C, E, G."),
        Q("O que transforma um acorde maior em menor?",["Baixar a terça meio tom","Baixar a quinta meio tom","Subir a fundamental"],0,"A terça é quem define maior ou menor."),
        Q("Uma tríade diminuta é feita de…",["duas terças maiores","duas terças menores","terça maior + terça menor"],1,"Terça menor + terça menor, resultando numa quinta diminuta.") ] },
  { id:'6.2', t:'Acordes com sétima', c:[
    "Empilhando mais uma terça sobre a tríade, aparece a **sétima**. São os acordes de quatro notas, ou **tétrades**.",
    W('tetrades'),
    "O mais importante é o **acorde de sétima da dominante**, escrito só com um 7 (G7): tríade maior com sétima menor. Dentro dele há um trítono (entre a terça e a sétima), e é essa tensão que empurra a música de volta para a tônica.",
    "No Brasil a sétima maior se escreve **7M** (C7M). Em material estrangeiro você vai ver **maj7**. É o mesmo acorde." ],
    q:[ Q("O acorde G7 tem tríade…",["maior com sétima menor","maior com sétima maior","menor com sétima menor"],0,"G B D F: tríade maior + sétima menor."),
        Q("C7M e Cmaj7 são…",["acordes diferentes","o mesmo acorde","um maior e um menor"],1,"Duas grafias para a tríade maior com sétima maior.") ] },
  { id:'6.3', t:'Inversões e baixo', c:[
    "Quando a nota mais grave do acorde não é a fundamental, o acorde está **invertido**. As notas são as mesmas; muda quem está embaixo.",
    "Na cifra, a inversão aparece com uma barra: **C/E** é o acorde de Dó com Mi no baixo. Lê-se “Dó com baixo em Mi”.",
    "Inversões servem para o baixo caminhar de forma suave. Em C – G/B – Am, o baixo desce degrau por degrau: C, B, A.",
    G("Para quem toca gaita, a barra importa pouco: as notas boas de tocar por cima do acorde continuam as mesmas. Leia a letra antes da barra.") ],
    q:[ Q("Em D/F#, qual é a nota mais grave?",["D","F#","A"],1,"A nota depois da barra é o baixo."),
        Q("C/E tem notas diferentes de C?",["Sim","Não, só muda o baixo"],1,"Mesmas notas, outra disposição.") ] },
  { id:'6.4', t:'Como ler uma cifra', c:[
    "A cifra é montada em camadas: a **letra** é a fundamental; um **m** depois dela indica menor; **números** indicam notas acrescentadas, contadas a partir da fundamental.",
    W('cifra'),
    "Em caso de dúvida, simplifique. C7M(9) continua sendo um acorde de Dó maior, e Am7 continua sendo Lá menor. Para escolher as notas da melodia, a tríade já diz quase tudo." ],
    q:[ Q("O que significa o “m” em Am7?",["Maior","Menor","Meio diminuto"],1,"m minúsculo depois da letra = acorde menor."),
        Q("Em Csus4, a terça foi trocada por…",["segunda","quarta","sexta"],1,"sus4 suspende a terça e põe a quarta no lugar.") ] },
  { id:'6.5', t:'Os acordes da gaita diatônica', c:[
    "A afinação da diatônica foi desenhada para dar acordes prontos. Com a gaita escolhida no topo do app:",
    W('acordesGaita'),
    "Isso explica as duas primeiras posições. Na **1ª posição** a música descansa no acorde soprado. Na **2ª posição** a música descansa no acorde aspirado dos furos 1 a 4, e é por isso que o blues, cheio de notas aspiradas e bends, mora ali.",
    G("O ritmo de trem (chugging) é só alternar esses dois acordes respirando no tempo: aspira, aspira, sopra, sopra.") ],
    q:[ Q("Na gaita em C, aspirando os furos 2, 3 e 4 juntos sai o acorde de…",["C","G","F"],1,"G, B e D: Sol maior."),
        Q("Na 2ª posição, a música descansa no acorde…",["soprado","aspirado nos furos graves"],1,"O acorde aspirado dos furos 1–4 é a tônica da 2ª posição.") ] }
]},
{ id:'m7', t:'Campo harmônico', d:'Os acordes que pertencem a um tom.', l:[
  { id:'7.1', t:'O campo harmônico maior', c:[
    "Monte um acorde sobre cada nota da escala, usando só notas da própria escala (uma sim, uma não). O resultado são sete acordes: o **campo harmônico** do tom.",
    W('campo',{modo:'maior'}),
    "O padrão é o mesmo em qualquer tom maior e vale decorar: **maior, menor, menor, maior, maior, menor, diminuto**. Acordes maiores em numeral maiúsculo (I, IV, V), menores em minúsculo (ii, iii, vi).",
    "A maior parte das músicas populares usa só acordes do campo. Saber o campo é saber de antemão quais acordes esperar." ],
    q:[ Q("No campo maior, quais graus são acordes maiores?",["I, IV e V","I, III e V","II, IV e VI"],0,"Tônica, subdominante e dominante são maiores."),
        Q("Qual é o acorde do vi grau em Sol maior?",["Em","E","Bm"],0,"G A B C D E: o sexto grau é Mi, e ali o acorde é menor."),
        Q("O acorde do VII grau do campo maior é…",["maior","menor","diminuto"],2,"vii°: tríade diminuta.") ] },
  { id:'7.2', t:'As três funções', c:[
    "Os sete acordes fazem só três trabalhos, chamados **funções harmônicas**:",
    U(["**Tônica** (I, e também vi e iii): repouso, sensação de chegada.","**Subdominante** (IV, e também ii): afastamento, movimento.","**Dominante** (V, e também vii°): tensão, que pede a volta para a tônica."]),
    "Quase toda música é uma viagem de ida e volta: sai do repouso, se afasta, cria tensão, resolve. Acordes de mesma função podem ser trocados entre si sem mudar o sentido da frase: Dm no lugar de F, Am no lugar de C.",
    W('progressao',{g:[0,3,4,0],modo:'maior',titulo:'Repouso, afastamento, tensão, repouso'}) ],
    q:[ Q("Qual função cria a tensão que pede resolução?",["Tônica","Subdominante","Dominante"],2,"O V grau puxa de volta para o I."),
        Q("Em Dó maior, qual acorde pode substituir o F mantendo a função?",["Dm","Em","G"],0,"ii e IV são os dois subdominantes.") ] },
  { id:'7.3', t:'O campo harmônico menor', c:[
    "Fazendo o mesmo sobre a escala menor natural, o padrão muda de lugar: são os mesmos acordes do tom relativo maior, começando de outro ponto.",
    W('campo',{modo:'menor'}),
    "Na prática quase toda música em tom menor troca o v menor por um **V maior com sétima**, tirado da menor harmônica. Em Lá menor: E7 no lugar de Em. O G# do acorde é a sensível que faltava.",
    W('campo',{modo:'menorH'}) ],
    q:[ Q("Em Lá menor, qual acorde costuma substituir o Em para resolver com mais força?",["E7","Dm","G"],0,"O V maior com sétima vem da menor harmônica."),
        Q("O campo de Lá menor natural tem os mesmos acordes do campo de…",["Dó maior","Lá maior","Mi maior"],0,"São tons relativos: mesmas notas, mesmos acordes.") ] },
  { id:'7.4', t:'Cadências', c:[
    "**Cadência** é o jeito como uma frase harmônica termina. Funciona como a pontuação de um texto.",
    U(["**Autêntica** (V – I): ponto final. A mais conclusiva.","**Plagal** (IV – I): final suave, o “amém” dos hinos.","**Meia cadência** (termina no V): vírgula. A frase fica em suspenso.","**De engano** (V – vi): você espera a tônica e vem o vi. A música continua."]),
    W('progressao',{g:[3,4,0],modo:'maior',titulo:'Autêntica: IV – V – I'}),
    W('progressao',{g:[0,3,0],modo:'maior',titulo:'Plagal: I – IV – I'}),
    W('progressao',{g:[3,4,5],modo:'maior',titulo:'De engano: IV – V – vi'}),
    G("Muitas músicas de missa terminam em cadência plagal. Se a última troca de acorde é IV – I, é ali que a sua frase final deve pousar na tônica.") ],
    q:[ Q("V – I é a cadência…",["plagal","autêntica","de engano"],1,"Dominante resolvendo na tônica."),
        Q("O “amém” dos hinos é uma cadência…",["plagal (IV – I)","autêntica (V – I)","meia cadência"],0,"Subdominante para tônica.") ] },
  { id:'7.5', t:'Progressões que você vai encontrar', c:[
    "Algumas sequências de acordes aparecem em milhares de músicas. Reconhecê-las pelo grau poupa muito trabalho.",
    W('progressao',{g:[0,3,4],modo:'maior',titulo:'I – IV – V: rock, country, folk, música de igreja'}),
    W('progressao',{g:[0,4,5,3],modo:'maior',titulo:'I – V – vi – IV: a progressão do pop'}),
    W('progressao',{g:[0,5,3,4],modo:'maior',titulo:'I – vi – IV – V: baladas dos anos 50'}),
    W('progressao',{g:[1,4,0],modo:'maior',titulo:'ii – V – I: jazz, bossa nova, MPB'}),
    W('progressao',{g:[0,5,6],modo:'menor',titulo:'i – VI – VII: rock em tom menor'}),
    "Quando tirar uma música nova, escreva os graus em vez dos acordes. Você vai perceber que já conhece a estrutura." ],
    q:[ Q("C – G – Am – F, em graus, é…",["I – V – vi – IV","I – IV – V – vi","I – vi – IV – V"],0,"C é I, G é V, Am é vi, F é IV."),
        Q("Dm – G – C é a progressão…",["I – IV – V","ii – V – I","vi – IV – I"],1,"Em Dó: Dm (ii), G (V), C (I).") ] },
  { id:'7.6', t:'Como descobrir o tom de uma música', c:[
    "Com a cifra na mão, quatro pistas resolvem quase todos os casos:",
    U(["**O último acorde.** A maioria das músicas termina na tônica.","**O acorde de repouso.** Em qual acorde as frases parecem chegar em casa?","**O acorde com sétima.** Um acorde maior com 7 (como E7) normalmente é o V: a tônica fica uma quinta abaixo (A ou Am).","**O conjunto.** Compare os acordes com os campos harmônicos. O tom é aquele em que todos, ou quase todos, se encaixam."]),
    "Um tom maior e o seu relativo menor têm os mesmos acordes. Para desempatar, veja onde a música começa e termina: Em C G D que termina em Em está em Mi menor, não em Sol maior.",
    "Na aba Músicas, o app faz essa conta quando você cola uma cifra. Use para conferir o seu raciocínio, não para substituí-lo.",
    G("Sem cifra: toque junto com a gravação e procure a nota que soa como “casa” no fim das frases. Essa nota é a tônica.") ],
    q:[ Q("Uma música com os acordes G, C, D e Em, terminando em G, provavelmente está em…",["Sol maior","Dó maior","Ré maior"],0,"G C D Em = I IV V vi de Sol maior."),
        Q("O acorde B7 costuma apontar para qual tônica?",["E ou Em","A ou Am","G"],0,"B7 é o V de Mi: a tônica fica uma quinta abaixo.") ] }
]},
{ id:'m8', t:'Além do campo harmônico', d:'Acordes de fora do tom e por que eles funcionam.', l:[
  { id:'8.1', t:'Dominantes secundários', c:[
    "Qualquer acorde do campo pode ganhar o seu próprio dominante: um acorde maior com sétima, uma quinta acima dele, que o “prepara”. Isso é um **dominante secundário**.",
    "Em Dó maior, o acorde A7 não pertence ao campo (tem C#). Mas A7 é o V de Ré, então ele aparece logo antes do Dm, como um empurrão.",
    W('dominantes'),
    "Regra prática: se aparecer um acorde maior com sétima que não é o V do tom, olhe o acorde seguinte. Quase sempre ele está uma quinta abaixo." ],
    q:[ Q("Em Dó maior, D7 prepara qual acorde?",["G","F","Am"],0,"D7 é o V de Sol."),
        Q("O dominante secundário fica a que distância do acorde que prepara?",["Uma quinta acima","Uma terça acima","Um tom acima"],0,"Como todo dominante: quinta acima do alvo.") ] },
  { id:'8.2', t:'Empréstimo modal', c:[
    "Uma música em tom maior pode pegar acordes emprestados do tom **homônimo menor**. Em Dó maior, entram acordes de Dó menor.",
    W('emprestimo'),
    "O mais comum é o **iv menor**: em Dó, F – Fm – C. A troca de A para Ab dá uma cor nostálgica muito reconhecível. No rock é frequente o **bVII** (Bb em Dó) e o **bVI** (Ab).",
    G("Quando entra um acorde emprestado, uma nota da escala muda. Em F – Fm, o Lá vira Láb: se a sua frase passar por essa nota, acompanhe a mudança.") ],
    q:[ Q("Em Dó maior, o acorde Fm é emprestado de…",["Dó menor","Lá menor","Fá maior"],0,"Fm é o iv de Dó menor, o homônimo."),
        Q("Qual nota muda de F para Fm?",["A vira Ab","C vira C#","F vira F#"],0,"A terça do acorde desce meio tom.") ] },
  { id:'8.3', t:'Modulação', c:[
    "**Modular** é mudar de tom no meio da música. Depois da modulação há uma nova tônica e um novo campo harmônico.",
    U(["**Para tons vizinhos** (um passo no ciclo de quintas): quase não se nota, porque seis das sete notas são iguais.","**Por acorde pivô**: um acorde que pertence aos dois tons faz a ponte.","**Subida direta**: o último refrão sobe meio tom ou um tom, de uma vez, para dar mais energia."]),
    G("Na diatônica, modulação pode significar trocar de gaita no meio da música ou mudar de posição. Na cromática, basta mudar de escala. Vale marcar na cifra onde a mudança acontece.") ],
    q:[ Q("Depois de uma modulação, o que muda?",["Só o andamento","A tônica e o campo harmônico","Só o ritmo"],1,"Mudar de tom é mudar de centro."),
        Q("Quantas notas dois tons vizinhos no ciclo de quintas têm em comum?",["4","5","6"],2,"Só uma nota de diferença.") ] },
  { id:'8.4', t:'Acordes de passagem', c:[
    "Dois recursos ligam acordes do campo com mais suavidade.",
    "O **diminuto de passagem** entra entre dois acordes vizinhos e sobe o baixo por semitom: C – C#° – Dm. Dura pouco e funciona como um degrau.",
    "O **dominante substituto** (SubV) troca o V7 por um acorde de sétima um semitom acima da tônica: Db7 no lugar de G7, resolvendo em C. Funciona porque os dois acordes têm o mesmo trítono. É recurso de jazz e bossa nova.",
    "Não precisa usar esses acordes para tocar bem. Precisa reconhecê-los para não se assustar quando aparecerem numa cifra." ],
    q:[ Q("Por que Db7 pode substituir G7?",["Têm o mesmo trítono","Têm a mesma fundamental","São o mesmo acorde"],0,"B e F (Cb e F) aparecem nos dois."),
        Q("Em C – C#° – Dm, o que o baixo faz?",["Sobe por semitons","Fica parado","Desce uma quinta"],0,"C, C#, D: um degrau de cada vez.") ] }
]},
{ id:'m9', t:'Modos, pentatônicas e blues', d:'Outras escalas e as cores que elas trazem.', l:[
  { id:'9.1', t:'Os sete modos', c:[
    "Pegue as notas de uma escala maior e comece de cada um dos sete graus. Cada ponto de partida dá uma escala de caráter diferente: os **modos**.",
    W('modos'),
    "O jeito mais útil de entender um modo é comparar com a escala maior ou menor da mesma tônica e ver qual nota muda:",
    U(["**Mixolídio**: maior com a sétima menor (b7). Som de rock e blues.","**Dórico**: menor com a sexta maior. Menor menos triste, muito usado em blues menor e funk.","**Lídio**: maior com a quarta aumentada (#4). Som aberto, “flutuante”.","**Frígio**: menor com a segunda menor (b2). Som espanhol.","**Jônio** é a própria escala maior; **eólio**, a menor natural; **lócrio** quase não se usa como tom."]),
    G("As posições da diatônica são os modos na prática: 1ª posição = jônio, 2ª = mixolídio, 3ª = dórico, 4ª = eólio, 5ª = frígio, 12ª = lídio.") ],
    q:[ Q("O modo mixolídio é a escala maior com…",["a terça menor","a sétima menor","a quarta aumentada"],1,"Maior com b7."),
        Q("O modo dórico é a escala menor com…",["a sexta maior","a segunda menor","a quinta diminuta"],0,"Menor natural com o sexto grau elevado."),
        Q("A 2ª posição da diatônica corresponde a qual modo?",["Jônio","Dórico","Mixolídio"],2,"Tocar a partir do V grau da gaita dá o mixolídio.") ] },
  { id:'9.2', t:'Pentatônicas', c:[
    "**Pentatônica** é uma escala de cinco notas. Ela tira da escala de sete justamente as duas notas que formam semitons, e por isso nenhuma nota soa “errada” sobre os acordes do tom.",
    "A **pentatônica maior** é a escala maior sem o 4º e o 7º grau:",
    W('escala',{tipo:'pentaM'}),
    "A **pentatônica menor** é a menor natural sem o 2º e o 6º grau:",
    W('escala',{tipo:'pentam'}),
    "As duas também são relativas: Dó pentatônica maior e Lá pentatônica menor têm as mesmas cinco notas.",
    G("Para improvisar, a pentatônica é o melhor ponto de partida. Menos notas, menos chance de travar, mais atenção para o ritmo e o som.") ],
    q:[ Q("Quais graus a pentatônica maior deixa de fora?",["2 e 6","4 e 7","3 e 5"],1,"Saem os dois graus que formam semitom."),
        Q("A pentatônica menor de Lá tem as mesmas notas da pentatônica maior de…",["Dó","Sol","Mi"],0,"Relativas: A menor e C maior.") ] },
  { id:'9.3', t:'A escala blues e as blue notes', c:[
    "A **escala blues** é a pentatônica menor com uma nota a mais: a **quinta diminuta (b5)**, entre a quarta e a quinta.",
    W('escala',{tipo:'blues'}),
    "As **blue notes** são a terça menor, a quinta diminuta e a sétima menor tocadas sobre uma harmonia maior. No canto e na gaita elas não são notas fixas: ficam “entre” as notas, um pouco mais baixas ou mais altas, escorregando. É esse escorregar que soa como blues.",
    G("Na 2ª posição da diatônica, as três blue notes saem com bend ou ao lado de um: b3 no -3', b5 no -4', b7 no -5. Por isso o bend não é enfeite no blues, é a própria escala.") ],
    q:[ Q("Qual nota a escala blues acrescenta à pentatônica menor?",["b5","6","7"],0,"A quinta diminuta, entre o 4 e o 5."),
        Q("As blue notes são…",["1, 4 e 5","b3, b5 e b7","2, 6 e 7"],1,"Terça menor, quinta diminuta e sétima menor.") ] },
  { id:'9.4', t:'Escolhendo a escala para tocar', c:[
    "Diante de uma música, a pergunta é: que escala cabe aqui? Um roteiro curto:",
    U(["**Tom maior, melodia “limpa”** (hinos, folk, pop): escala maior ou pentatônica maior do tom.","**Blues, rock, country com pegada**: pentatônica menor ou escala blues **da mesma tônica**, mesmo o tom sendo maior. Esse choque é o som do estilo.","**Tom menor**: menor natural ou pentatônica menor. Se soar pesado demais, experimente o dórico.","**Acordes de sétima parados** (um só acorde por muito tempo): mixolídio."]),
    "Na aba Escalas você escolhe tônica e tipo e vê onde cada uma dessas escalas está na sua gaita.",
    W('abrirEscalas') ],
    q:[ Q("Num blues em Sol maior, qual escala dá o som característico?",["Sol maior","Sol blues","Dó maior"],1,"A escala blues da mesma tônica, sobre acordes maiores."),
        Q("Para um hino em Dó maior, o ponto de partida é…",["a escala de Dó maior","a escala blues de Dó","o modo frígio"],0,"Melodias tonais usam a escala maior do tom.") ] }
]},
{ id:'m10', t:'A linguagem do blues', d:'Forma, acordes e fraseado.', l:[
  { id:'10.1', t:'Os doze compassos', c:[
    "O blues tem uma forma fixa de **12 compassos** que se repete do começo ao fim da música. Quem conhece a forma sabe onde está a qualquer momento, em qualquer tom.",
    W('blues12'),
    "São três linhas de quatro compassos. A primeira fica na tônica. A segunda vai para o IV e volta. A terceira sobe ao V, desce pelo IV e volta para casa.",
    G("Antes de improvisar, aprenda a ouvir a forma. Toque só a tônica de cada acorde, uma nota por compasso, até sentir as trocas chegarem sem contar.") ],
    q:[ Q("Em que compasso o blues vai pela primeira vez para o IV grau?",["No 3º","No 5º","No 9º"],1,"Compassos 5 e 6 são do IV."),
        Q("Em que compasso entra o V grau?",["No 5º","No 7º","No 9º"],2,"A terceira linha começa no V.") ] },
  { id:'10.2', t:'Sétima em todos os acordes', c:[
    "No blues, os três acordes são de **sétima da dominante**: I7, IV7 e V7. Pela teoria tradicional só o V teria essa sétima. No blues, ela é a cor do estilo.",
    "Daí vem a mistura que define o som: os acordes têm **terça maior**, e a melodia insiste na **terça menor** (uma blue note). As duas brigam um pouco, e essa briga é o blues.",
    "As sétimas dos acordes I7 e IV7 são justamente blue notes do tom: a b7 e a b3." ],
    q:[ Q("Num blues em Lá, os acordes são…",["A7, D7 e E7","Am, Dm e Em","A, D e E7M"],0,"I7, IV7 e V7."),
        Q("O som do blues vem do choque entre a terça maior do acorde e…",["a terça menor da melodia","a quinta justa","a oitava"],0,"Terça menor sobre acorde maior.") ] },
  { id:'10.3', t:'Variações da forma', c:[
    U(["**Quick change**: o segundo compasso vai para o IV e volta ao I no terceiro. Dá movimento logo no começo.","**Turnaround**: os dois últimos compassos, que preparam a volta ao início. Normalmente terminam no V.","**Stops (breaks)**: a banda dá um acorde seco no tempo 1 e para; a voz ou a gaita preenche o silêncio.","**Blues menor**: a mesma forma com acordes menores (i, iv) e, em geral, V7."]),
    "Essas variações não mudam o tamanho da forma. São doze compassos de qualquer jeito.",
    G("O turnaround é o lugar clássico de uma frase de gaita que termina no V grau, deixando a música “pedindo” o recomeço.") ],
    q:[ Q("No quick change, qual acorde aparece no 2º compasso?",["I","IV","V"],1,"Sobe para o IV e volta."),
        Q("O turnaround fica…",["nos dois primeiros compassos","no meio da forma","nos dois últimos compassos"],2,"Ele prepara a volta ao início.") ] },
  { id:'10.4', t:'Pergunta e resposta', c:[
    "O fraseado do blues vem do canto: uma voz **pergunta**, outra **responde**. A forma clássica dos versos é **AAB**: uma frase, a mesma frase repetida, e uma terceira que conclui.",
    "Na prática, toque uma frase curta de mais ou menos dois compassos e **fique em silêncio** pelos dois seguintes. O silêncio é a resposta, ou o espaço para o outro instrumento responder.",
    U(["Frases curtas valem mais que frases longas.","Repetir uma ideia é bom. Repetir com uma pequena mudança é melhor.","Termine as frases em notas do acorde (tônica, terça, quinta) para soar resolvido, ou fora delas para deixar em suspenso."]),
    G("Um exercício que funciona: ligue o metrônomo, toque dois compassos, respire dois. Não vale emendar.") ],
    q:[ Q("A forma AAB quer dizer…",["três frases diferentes","frase, repetição e conclusão","refrão, verso, refrão"],1,"Duas vezes a mesma ideia e uma resposta."),
        Q("Depois de uma frase curta, o melhor é…",["emendar outra","deixar silêncio","tocar mais forte"],1,"O espaço faz parte da frase.") ] },
  { id:'10.5', t:'Seguindo os acordes', c:[
    "Dá para tocar um blues inteiro só com a escala blues do tom. Mas o solo fica muito melhor quando as frases **marcam as trocas de acorde**.",
    U(["No **I7**: descanse na tônica, na terça ou na quinta do tom.","No **IV7**: a tônica do tom continua servindo (ela é a quinta do IV). A terça do IV é a nota que mais anuncia a troca.","No **V7**: mire a tônica do V ou a sua terça, que é a sensível do tom."]),
    W('notasAlvo'),
    G("Na 2ª posição: I no -2, IV no +4 (ou +1), V no -4 (ou -1). Saber de cor esses três endereços já organiza o improviso.") ],
    q:[ Q("Na 2ª posição, onde está a tônica do acorde IV?",["-2","+4","-4"],1,"O IV é o tom da própria gaita: furos soprados 1, 4, 7 e 10."),
        Q("Marcar as trocas de acorde serve para…",["tocar mais rápido","o solo acompanhar a harmonia","mudar de tom"],1,"A melodia mostra que ouviu a harmonia.") ] }
]},
{ id:'m11', t:'Melodia sobre harmonia', d:'Como notas e acordes conversam.', l:[
  { id:'11.1', t:'Notas do acorde e notas de passagem', c:[
    "Sobre qualquer acorde, as notas se dividem em dois grupos. **Notas do acorde** (fundamental, terça, quinta, sétima) soam estáveis. As outras são **notas de passagem**: ligam uma nota do acorde a outra e criam movimento.",
    "Uma melodia que funciona costuma pôr notas do acorde nos **tempos fortes** e nas notas longas, e deixar as de passagem para os tempos fracos e as notas rápidas.",
    "Não é uma regra rígida. É o motivo de certas notas soarem “certas” num lugar e “estranhas” em outro, mesmo estando todas na escala." ],
    q:[ Q("Sobre o acorde de C, qual destas é nota do acorde?",["D","E","F"],1,"C, E e G formam o acorde."),
        Q("Onde as notas do acorde costumam cair?",["Nos tempos fortes e notas longas","Só nos tempos fracos","Em qualquer lugar"],0,"É onde o ouvido mais presta atenção.") ] },
  { id:'11.2', t:'Achando a melodia a partir da cifra', c:[
    "Quando você tem a cifra e a gravação, mas não a tablatura, dá para chegar na melodia com método:",
    U(["**1. Descubra o tom** pelos acordes e monte a escala. A melodia usa quase só essas sete notas.","**2. Cante a melodia** devagar, frase por frase. Se você não consegue cantar, ainda não ouviu direito.","**3. Ache a primeira nota.** Ela quase sempre é uma nota do acorde que está soando: teste a fundamental, a terça e a quinta.","**4. Siga o contorno.** A próxima nota sobe, desce ou repete? Dá um passo (nota vizinha na escala) ou um salto?","**5. Confira nas trocas de acorde.** A nota longa de cada frase deve pertencer ao acorde daquele momento."]),
    "Escreva em nomes de notas primeiro (E E E F# G) e só depois converta para furos. Assim a melodia serve para qualquer gaita.",
    G("Na aba Transpor, cole as notas ou a tab e o app converte para a diatônica ou a cromática que você escolher.") ],
    q:[ Q("A primeira nota de uma melodia costuma ser…",["uma nota do acorde que está soando","sempre a tônica do tom","uma nota fora da escala"],0,"Fundamental, terça ou quinta do acorde do momento."),
        Q("Por que anotar a melodia em nomes de notas antes dos furos?",["Fica mais bonito","Serve para qualquer gaita","É mais rápido de tocar"],1,"Notas são universais; furos dependem da gaita.") ] },
  { id:'11.3', t:'Construindo um solo', c:[
    "Um solo bom conta uma história pequena. Os recursos são poucos e valem para qualquer estilo:",
    U(["**Motivo**: uma ideia curta, de três a cinco notas, com ritmo marcante.","**Repetição**: toque o motivo de novo. O ouvinte precisa reconhecer para gostar.","**Variação**: mude o final, o ritmo ou a oitava.","**Contraste**: depois de frases curtas, uma longa; depois do grave, o agudo.","**Respiração**: deixe pausas. Solo sem pausa cansa quem toca e quem ouve.","**Curva**: comece simples, cresça e guarde o ponto mais alto para perto do fim."]),
    G("Menos notas, mais intenção. Uma nota longa com bom som e vibrato vale mais que uma escala inteira despejada.") ],
    q:[ Q("Depois de apresentar um motivo, o próximo passo natural é…",["repetir","mudar de tom","tocar o mais rápido possível"],0,"Repetir faz o ouvinte reconhecer a ideia."),
        Q("O ponto mais alto de um solo costuma ficar…",["logo no começo","perto do fim","no meio exato"],1,"A curva cresce e resolve.") ] }
]},
{ id:'m12', t:'Transposição e posições', d:'Tocar a mesma música em outro tom ou em outra gaita.', l:[
  { id:'12.1', t:'Transpor por graus', c:[
    "**Transpor** é levar uma música para outro tom mantendo tudo igual por dentro. O jeito mais seguro é pensar em graus.",
    "Converta os acordes do tom original em graus, depois leia os mesmos graus no campo do tom novo. G – C – D em Sol maior é I – IV – V; em Lá maior, I – IV – V é A – D – E.",
    "Com a melodia é igual: cada nota é um grau da escala. O 3º grau de Sol (B) vira o 3º grau de Lá (C#).",
    W('abrirTranspor') ],
    q:[ Q("G – Em – C – D transposto para Ré maior fica…",["D – Bm – G – A","D – Em – G – A","D – Bm – F – A"],0,"I – vi – IV – V em Ré."),
        Q("O que se mantém numa transposição?",["Os nomes das notas","Os graus e os intervalos","A armadura"],1,"A estrutura fica; os nomes mudam.") ] },
  { id:'12.2', t:'Transpor por intervalo', c:[
    "O outro caminho é mecânico: meça a distância entre o tom antigo e o novo e mova **todas** as notas e acordes essa mesma distância.",
    "De Sol para Lá é um tom acima. Então tudo sobe um tom: G vira A, C vira D, Em vira F#m. O tipo do acorde nunca muda.",
    "Cuidado com os semitons naturais: um tom acima de E é F#, e não F. Na dúvida, conte os semitons.",
    G("Trocar de gaita diatônica tocando os mesmos furos é uma transposição automática: os furos ficam, o tom muda junto com a gaita.") ],
    q:[ Q("Um tom acima de Em é…",["Fm","F#m","Gm"],1,"E a F é só um semitom; um tom é F#."),
        Q("Ao transpor, um acorde menor…",["vira maior","continua menor","perde a sétima"],1,"Só a fundamental se move.") ] },
  { id:'12.3', t:'As posições da gaita', c:[
    "**Posição** é a relação entre o tom da gaita e o tom em que você toca nela. A mesma gaita toca em vários tons; em cada um, a tônica muda de furo e a escala natural muda de caráter.",
    W('posicoes'),
    "As posições seguem o ciclo de quintas: cada posição está uma quinta acima da anterior.",
    U(["**1ª posição**: o tom da gaita. Melodias, hinos, folk.","**2ª posição**: uma quinta acima. Blues, rock, country. A mais usada.","**3ª posição**: um tom acima do tom da gaita. Menor com sabor de blues.","**4ª posição**: o relativo menor do tom da gaita. Menor natural sem bends."]) ],
    q:[ Q("Numa gaita em C, a 2ª posição toca em…",["G","F","D"],0,"Uma quinta acima de C."),
        Q("Para tocar blues em Mi na 2ª posição, a gaita é em…",["E","A","B"],1,"A gaita fica uma quarta acima do tom: Lá."),

var SECOES=['Em foco','Igreja','Repertório','Técnica','Cajon','Métodos','Links','Outros'];
var HARP_WORD={ 'lá':9,'la':9,'a':9,'sol':7,'g':7,'dó':0,'do':0,'c':0,'ré':2,'re':2,'d':2,'mi':4,'e':4,'fá':5,'fa':5,'f':5,'si':11,'b':11,'bb':10,'sib':10,'eb':3,'mib':3,'ab':8,'láb':8,'db':1,'f#':6 };
function guessHarp(text){

  if(/[+\-−]\d+'*</.test(t)) return {type:'crom'};          // marca de botão: é cromática
  var m=/gaita em ([A-Za-zÀ-ÿ#]+)/i.exec(t);
  if(m){ var k=HARP_WORD[m[1].toLowerCase()]; if(k!==undefined) return {type:'diat',key:k}; }
  if(/crom[aá]tica/i.test(t)) return {type:'crom'};
  return null;
}
function fmtDate(ts){ if(!ts) return ''; var d=new Date(ts); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear(); }
function linkify(text){

  while((m=re.exec(text))){ if(m.index>last) out.push(document.createTextNode(text.slice(last,m.index))); var url=m[1].replace(/[.,;:)\]]+$/,''); out.push(el('a',{href:url,target:'_blank',rel:'noopener noreferrer',text:url.replace(/^https?:\/\/(www\.)?/,'').slice(0,48)})); if(url.length<m[1].length) out.push(document.createTextNode(m[1].slice(url.length))); last=m.index+m[1].length; }

/* ---------- curso de cajon ---------- */
function CJG(text){ return { cajon:text }; }
var CJ_CURSO=[
{ id:'cjm1', t:'O instrumento', d:'De onde vem, como sentar e como tirar os sons.', l:[
  { id:'cj1.1', t:'O que é o cajon', c:[
    "O **cajon** é uma caixa de madeira em que o músico senta e toca com as mãos na tampa da frente. Nasceu no litoral do Peru, entre africanos escravizados que usavam caixotes como tambor.",
    "Em 1977 o violonista Paco de Lucía conheceu o instrumento em Lima e o levou para o flamenco. Quem tocava cajon no grupo dele era o percussionista brasileiro Rubem Dantas. Foi dali que o cajon se espalhou pelo mundo.",
    "No flamenco o cajon ganhou cordas ou uma **esteira** encostada por dentro da tampa. É ela que dá o chiado de caixa no som agudo. O cajon peruano tradicional não tem esteira.",
    U(["**Tampa da frente** (tapa): madeira fina, é onde se toca.","**Corpo**: madeira mais grossa, é onde se senta.","**Boca**: o furo de trás, por onde sai o grave.","**Esteira ou cordas**: por dentro, encostadas na tampa."]),
    CJG("Hoje o cajon faz o papel de uma bateria pequena: o grave substitui o bumbo e o agudo substitui a caixa. É por isso que ele funciona em quase qualquer estilo.") ],
    q:[ Q("Em que país surgiu o cajon?",["Espanha","Peru","Cuba"],1,"Ele nasceu no litoral do Peru e só depois entrou no flamenco espanhol."),
        Q("O que a esteira acrescenta ao som?",["O chiado de caixa no agudo","Mais volume no grave","Afinação"],0,"A esteira vibra contra a tampa e dá o som de caixa.") ] },
  { id:'cj1.2', t:'Postura', c:[
    "Sente no fundo do tampo de cima, com os pés inteiros no chão e os joelhos afastados. A tampa da frente fica livre entre as pernas.",
    "Coluna reta e ombros soltos. As mãos trabalham no terço de cima da tampa. Você não precisa se curvar para alcançar o grave.",
    U(["Quem toca curvado cansa a lombar em poucos minutos e perde o grave.","Inclinar o cajon um pouco para trás aproxima a tampa das mãos. É opcional.","Braços soltos ao lado do corpo. Cotovelo colado ou aberto demais trava o pulso."]),
    CJG("Antes de estudar, sacuda as mãos e gire os punhos por um minuto. A tampa é dura: mão fria e tensa dói e soa pior.") ],
    q:[ Q("Onde as mãos tocam na maior parte do tempo?",["No meio da tampa","No terço de cima","Perto do chão"],1,"Agudo na borda, grave um palmo abaixo dela. Tudo no terço de cima."),
        Q("O que acontece quando você se curva para tocar?",["O som fica mais grave","Cansa as costas e não melhora o som","Nada"],1,"O grave bom está perto. Curvar-se só cansa.") ] },
  { id:'cj1.3', t:'Os três sons', c:[
    "Quase tudo o que se toca no cajon sai de três sons.",
    U(["**Grave (G)**: mão inteira, dedos juntos e relaxados, cerca de um palmo abaixo da borda de cima, no meio da largura. A mão bate e sai.","**Agudo (A)**: os dedos na borda de cima, mais perto do canto. A palma fica fora da tampa. É seco e estalado.","**Fantasma (f)**: só a ponta dos dedos, quase sem peso. Preenche o tempo entre os toques fortes."]),
    W('grade',{n:'Grave, agudo e fantasma',p:'G...A...f.f.f.f.',bpm:70}),
    "O erro mais comum é deixar a mão **parada na tampa** depois do toque. Isso abafa a madeira e mata o grave. Pense em bater numa chapa quente.",
    CJG("O volume vem da velocidade e da altura da mão, não da força do braço. Mão solta soa mais e dói menos.") ],
    q:[ Q("Como se tira o grave?",["Com a ponta dos dedos na borda","Com a mão inteira, um palmo abaixo da borda","Com o punho fechado no meio"],1,"Mão inteira e relaxada, que bate e sai."),
        Q("Para que serve o toque fantasma?",["Para preencher o tempo entre os toques fortes","Para fazer o som mais alto","Para marcar o tempo 1"],0,"Ele dá movimento sem competir com grave e agudo.") ] },
  { id:'cj1.4', t:'Como ler a grade', c:[
    "Neste app as levadas aparecem numa **grade**. Cada casa é uma subdivisão do tempo, lida da esquerda para a direita.",
    W('grade',{n:'Um compasso de 4/4',p:'G.f.A.f.G.G.A.f.',h:'D.E.D.E.D.E.D.E.',bpm:75}),
    W('gradeLegenda'),
    U(["A linha de cima da grade é a **contagem**: os números são os tempos, o “e” é a metade do tempo.","Linha **A**: bloco cheio é agudo, ponto pequeno é toque fantasma.","Linha **G**: bloco cheio é grave.","Linha **mão**, quando aparece: D é direita, E é esquerda.","A barra mais forte à esquerda de uma casa marca o começo de cada tempo."]),
    "O botão **Tocar** repete a levada em loop, com um compasso de contagem antes. Use “−” e “+” para mudar o andamento e desligue o clique quando quiser ouvir só o cajon.",
    CJG("Quem é canhoto pode inverter todas as mãos. A regra é a mesma: a mão forte costuma ficar com o grave e a outra com o agudo, mas as duas precisam saber fazer os dois.") ],
    q:[ Q("Na grade, o que é um ponto pequeno na linha A?",["Um agudo forte","Um toque fantasma","Uma pausa"],1,"Ponto pequeno é fantasma. Bloco cheio é agudo."),
        Q("O que os números da linha de contagem marcam?",["Os tempos do compasso","Os dedos","O volume"],0,"Cada número é o começo de um tempo.") ] },
  { id:'cj1.5', t:'Som bom sem machucar as mãos', c:[
    "Tocar forte o tempo todo é o caminho mais curto para a dor e para um som ruim. O cajon responde melhor a um toque rápido e solto do que a um toque pesado.",
    U(["Aqueça as mãos antes. Dois minutos de toques fantasma bastam.","Tire anéis e relógio.","Se a base dos dedos doer no agudo, você está batendo com o osso na quina. Suba um pouco a mão e use a parte macia dos dedos.","Faça pausas. Dor aguda é sinal para parar, não para insistir."]),
    "Cada cajon tem um ponto doce para o grave e outro para o agudo. Passe um tempo procurando: toque em vários lugares e ouça onde o grave fica mais cheio e onde o agudo estala mais.",
    CJG("Grave bem o som do seu melhor grave e do seu melhor agudo. Esse é o padrão que você vai tentar repetir em todas as notas.") ],
    q:[ Q("De onde vem o volume no cajon?",["Da força do braço","Da velocidade e da altura da mão","Do tamanho da mão"],1,"Mão solta e rápida soa mais do que mão pesada."),
        Q("Dor na base dos dedos ao tocar o agudo indica o quê?",["Que o osso está batendo na quina","Que o cajon está desafinado","Que falta força"],0,"Ajuste a posição para tocar com a parte macia dos dedos.") ] } ]},

{ id:'cjm2', t:'Ritmo', d:'Pulso, compasso e subdivisão: a matéria-prima de quem toca percussão.', l:[
  { id:'cj2.1', t:'Pulso e andamento', c:[
    "**Pulso** é a batida regular que você acompanha batendo o pé. Ele continua existindo quando ninguém toca nada.",
    "**Andamento** é a velocidade do pulso, medida em batidas por minuto (BPM). A 60 BPM há uma batida por segundo; a 120, duas.",
    W('ritmo',{p:'pulso'}),
    "Numa banda, quem segura o pulso é a percussão. Se o violão oscila, a música balança. Se o cajon oscila, a música cai.",
    CJG("Estude sempre com metrônomo e mais devagar do que parece necessário. O metrônomo fica no topo do app em todas as telas.") ],
    q:[ Q("A 120 BPM, quantas batidas cabem em um segundo?",["Uma","Duas","Quatro"],1,"120 por minuto são duas por segundo."),
        Q("O pulso para durante uma pausa?",["Sim","Não"],1,"O pulso é a régua. A pausa é silêncio medido por ela.") ] },
  { id:'cj2.2', t:'Compasso', c:[
    "Os pulsos se agrupam em **compassos**. O primeiro tempo de cada compasso é o apoio, e é nele que as frases costumam começar.",
    U(["**4/4**: quatro tempos. É o compasso da maior parte do pop, do rock e do country.","**2/4**: dois tempos. É como se escreve samba, baião e a maior parte da música brasileira.","**3/4**: três tempos, o compasso da valsa.","**6/8**: dois tempos, cada um dividido em três."]),
    W('ritmo',{p:'valsa'}), W('ritmo',{p:'seis8'}),
    "Para descobrir o compasso de uma música, bata o pé no pulso e procure o apoio que se repete. Conte quantos pulsos há de um apoio ao outro.",
    CJG("Na dúvida entre 4/4 e 2/4, não se preocupe: a diferença é de escrita. Quatro semicolcheias por tempo valem para os dois.") ],
    q:[ Q("Em que compasso se costuma escrever o samba?",["2/4","3/4","6/8"],0,"Samba, baião e choro são escritos em 2/4."),
        Q("Quantos tempos tem um compasso de 6/8, do jeito que se sente?",["Seis","Dois, de três notas cada","Três"],1,"Sente-se em dois: UM-dois-três, DOIS-dois-três.") ] },
  { id:'cj2.3', t:'Subdivisão', c:[
    "Cada tempo pode ser dividido em partes iguais. É na subdivisão que mora o balanço.",
    W('ritmo',{p:'colcheias'}), W('ritmo',{p:'tercinas'}), W('ritmo',{p:'semicolcheias'}),
    U(["**Colcheias**: duas por tempo. Conta-se “um-e, dois-e”.","**Tercinas**: três por tempo. “Um-e-a, dois-e-a”.","**Semicolcheias**: quatro por tempo. “Um-i-e-a, dois-i-e-a”."]),
    "Quem toca bem não pensa só nos toques fortes. Pensa na subdivisão inteira e escolhe em quais casas tocar. As outras continuam passando por dentro.",
    CJG("O toque fantasma serve exatamente para isso: as mãos marcam todas as subdivisões, e só algumas viram grave ou agudo.") ],
    q:[ Q("Quantas semicolcheias cabem em um tempo?",["Duas","Três","Quatro"],2,"Quatro por tempo, dezesseis num compasso de 4/4."),
        Q("Como se conta a tercina?",["Um-e","Um-e-a","Um-i-e-a"],1,"Três sílabas, três notas por tempo.") ] },
  { id:'cj2.4', t:'Tempo forte, contratempo e backbeat', c:[
    "Num compasso de 4/4, os tempos **1 e 3** são os apoios naturais. No pop, no rock e no country, a caixa responde nos tempos **2 e 4**. Esse acento se chama **backbeat**.",
    W('grade',{n:'Grave no 1 e no 3, agudo no 2 e no 4',p:'G...A...G...A...',bpm:85}),
    "**Contratempo** é o que fica entre os tempos: os “e” da contagem.",
    W('ritmo',{p:'contratempo'}),
    "Quando o público bate palma numa música pop, bate no 2 e no 4. É o lugar do seu agudo.",
    CJG("O backbeat precisa ser a nota mais constante da levada. Pode variar o grave à vontade; o agudo do 2 e do 4 não sai do lugar.") ],
    q:[ Q("Onde cai o backbeat no 4/4?",["Nos tempos 1 e 3","Nos tempos 2 e 4","Nos “e”"],1,"Caixa no 2 e no 4."),
        Q("O que é contratempo?",["O primeiro tempo do compasso","O que fica entre um tempo e outro","Uma pausa longa"],1,"São os “e” da contagem.") ] },
  { id:'cj2.5', t:'Síncope e a célula 3-3-2', c:[
    "**Síncope** é acentuar onde o ouvido não espera: numa parte fraca, deixando a parte forte seguinte sem ataque. Ela cria a sensação de empurrão.",
    W('ritmo',{p:'sincope'}),
    "Uma síncope muito usada agrupa oito semicolcheias em **3 + 3 + 2**, em vez de 4 + 4.",
    W('grade',{n:'3-3-2 em 2/4',p:'G..G..A.|G..G..A.',beats:2,bpm:80}),
    "Essa célula aparece no baião, em levadas de pop e em muita música latina. Aprenda a reconhecê-la de ouvido: longa, longa, curta.",
    CJG("Ao tocar uma síncope, continue sentindo o pulso no pé. A graça dela é soar contra um pulso que não se mexe.") ],
    q:[ Q("O que é síncope?",["Tocar mais forte","Acentuar a parte fraca e calar a parte forte que vem depois","Tocar mais rápido"],1,"É o deslocamento do acento."),
        Q("Como a célula 3-3-2 agrupa oito semicolcheias?",["4 + 4","3 + 3 + 2","2 + 2 + 2 + 2"],1,"Três, três e duas.") ] },
  { id:'cj2.6', t:'Shuffle e swing', c:[
    "No **shuffle** as colcheias não são iguais: a primeira é longa e a segunda é curta. Na prática o tempo se divide em três, e você toca a primeira e a terceira parte.",
    W('ritmo',{p:'colcheias'}), W('ritmo',{p:'shuffle'}),
    W('grade',{n:'Shuffle no cajon',p:'G.fA.fG.fA.f',div:3,bpm:90}),
    "É o balanço do blues e de boa parte do rock antigo e do country.",
    CJG("Antes de tocar uma música nova, descubra se as colcheias são retas ou em shuffle. Tocar reto por cima de um shuffle é o tipo de erro que todo mundo percebe.") ],
    q:[ Q("No shuffle, o tempo se divide em quantas partes?",["Duas","Três","Quatro"],1,"Três partes: toca-se a primeira e a terceira."),
        Q("Que estilo usa shuffle o tempo todo?",["Blues","Valsa","Samba"],0,"O shuffle é a marca do blues.") ] } ]},

{ id:'cjm3', t:'Levada', d:'Como montar um acompanhamento que sustenta a música.', l:[
  { id:'cj3.1', t:'O que é uma levada', c:[
    "**Levada** (ou groove) é o desenho rítmico que se repete e sustenta a música. No cajon ela se monta com três camadas, copiadas da bateria.",
    U(["**Grave**: faz o papel do bumbo. Anda junto com o baixo.","**Agudo**: faz o papel da caixa. Marca o backbeat.","**Fantasmas**: fazem o papel do chimbal. Mantêm a subdivisão correndo."]),
    W('grade',{n:'As três camadas juntas',p:'G.f.A.f.G.G.A.f.',h:'D.E.D.E.D.E.D.E.',bpm:80}),
    "Uma boa levada é a que o resto da banda nem percebe: todo mundo se sente confortável tocando em cima dela.",
    CJG("Para tirar a levada de uma gravação, ouça três vezes: uma só para o bumbo, uma só para a caixa, uma só para o chimbal. Depois junte.") ],
    q:[ Q("Que peça da bateria o grave do cajon substitui?",["A caixa","O bumbo","O prato"],1,"Grave é bumbo, agudo é caixa."),
        Q("Qual é a função dos toques fantasma na levada?",["Manter a subdivisão correndo","Marcar o refrão","Substituir o grave"],0,"Eles fazem o trabalho do chimbal.") ] },
  { id:'cj3.2', t:'Levada básica e variações do grave', c:[
    "A levada mais usada tem grave no 1 e no 3 e agudo no 2 e no 4. A partir dela, quase tudo é variação do grave.",
    W('grade',{n:'Básica',p:'G...A...G...A...',bpm:85}),
    W('grade',{n:'Grave duplo no 3',p:'G...A...G.G.A...',bpm:85}),
    W('grade',{n:'Grave antes do 3',p:'G...A.G.G...A...',bpm:85}),
    "Repare que o agudo não saiu do lugar em nenhuma delas. É isso que mantém a música reconhecível enquanto o grave conversa com o baixo.",
    CJG("Para escolher a variação, ouça o baixo ou a mão direita do violão. O grave do cajon soa melhor quando cai junto com as notas deles.") ],
    q:[ Q("Nas variações da levada básica, o que costuma ficar fixo?",["O grave","O agudo no 2 e no 4","Os fantasmas"],1,"O backbeat fica parado. O grave é que se move."),
        Q("Com que instrumento o grave do cajon deve andar junto?",["Com o baixo","Com a voz","Com o solo de guitarra"],0,"Bumbo e baixo formam a base.") ] },
  { id:'cj3.3', t:'Mão a mão ou mão que lidera', c:[
    "Há duas maneiras de organizar as mãos numa levada.",
    U(["**Mão a mão**: as mãos alternam sem parar, D E D E, e os sons caem na mão que estiver passando. É estável e bom para levadas cheias.","**Mão que lidera**: a mão forte faz grave e agudo, e a outra só preenche com fantasmas. É mais fácil no começo e bom para levadas espaçadas."]),
    W('grade',{n:'Mão a mão',p:'GfffAfffGfGfAfff',h:'DEDEDEDEDEDEDEDE',bpm:72}),
    W('grade',{n:'Mão que lidera',p:'G.f.A.f.G.f.A.f.',h:'D.E.D.E.D.E.D.E.',bpm:80}),
    "Nenhuma é a certa. O que importa é decidir antes qual mão toca cada nota e repetir sempre igual.",
    CJG("Se uma levada trava sempre no mesmo ponto, escreva as mãos casa por casa. Quase sempre o problema é uma mão que não sabe o que fazer.") ],
    q:[ Q("Na organização mão a mão, o que as mãos fazem?",["Alternam sem parar","Tocam sempre juntas","Só a direita toca"],0,"D E D E o tempo todo."),
        Q("Por que decidir a ordem das mãos antes?",["Para tocar mais forte","Para repetir sempre igual e não travar","Para cansar menos a voz"],1,"Levada que trava costuma ter uma mão indecisa.") ] },
  { id:'cj3.4', t:'Dinâmica e acento', c:[
    "**Dinâmica** é a variação de volume. É o que separa uma levada que soa como música de uma que soa como exercício.",
    U(["Três níveis bastam: **fantasma** (quase inaudível), **normal** e **acento**.","O acento só existe por contraste. Se tudo for forte, nada é acento.","Volume baixo não é andamento lento. Baixar o som sem atrasar é uma habilidade que se treina."]),
    W('grade',{n:'Acento no começo de cada tempo',p:'AfffAfffAfffAfff',h:'DEDEDEDEDEDEDEDE',bpm:72}),
    "A altura da mão controla o volume. Para um fantasma, a mão sai de dois dedos da tampa. Para um acento, de um palmo.",
    CJG("Num lugar pequeno, o cajon cobre a voz com facilidade. Na dúvida, toque mais baixo do que acha que deve.") ],
    q:[ Q("O que faz um acento ser percebido?",["A força","O contraste com as notas em volta","O andamento"],1,"Sem notas baixas ao redor, não há acento."),
        Q("O que controla o volume de um toque?",["A altura de onde a mão sai","A cor da madeira","A posição dos pés"],0,"Mão baixa, som baixo. Mão alta, som forte.") ] },
  { id:'cj3.5', t:'Tocar para a música', c:[
    "O trabalho do cajon é fazer a música andar e deixar o cantor confortável. Mostrar técnica vem muito depois disso.",
    U(["**Menos é mais.** Uma levada simples e firme vale mais que uma cheia e instável.","**Ouça a voz.** Se a letra tem muitas sílabas, toque menos. Se há espaço, você pode preencher.","**Não mude sem motivo.** Troque de levada quando a música troca de parte.","**Viradas são pontuação.** Uma por passagem é suficiente."]),
    "Um bom teste: grave a banda e ouça. Se o cajon chama mais atenção que a voz, está sobrando.",
    CJG("Ao aprender uma música, toque a primeira vez só com a levada básica do começo ao fim. Só depois acrescente o resto.") ],
    q:[ Q("Quando faz sentido trocar de levada?",["A cada compasso","Quando a música muda de parte","Quando der vontade"],1,"A levada acompanha a forma da música."),
        Q("O que vale mais para a banda?",["Uma levada simples e firme","Uma levada cheia e instável","Muitas viradas"],0,"Firmeza vem antes de enfeite.") ] },
  { id:'cj3.6', t:'Tempo firme', c:[
    "Todo mundo acelera e atrasa em lugares previsíveis. Conhecer os seus é meio caminho.",
    U(["**Acelera-se** nas viradas, nos refrões e quando o volume sobe.","**Atrasa-se** nas partes calmas, quando o volume baixa e quando a mão cansa.","**Correr** é mais comum do que atrasar, principalmente ao vivo."]),
    "Três estudos que resolvem:",
    U(["Metrônomo só no 2 e no 4: você precisa pôr o 1 e o 3 no lugar.","Dois compassos tocando, dois em silêncio, e voltar junto com o clique.","Gravar-se sem metrônomo e depois conferir o andamento do começo e do fim."]),
    W('abrirCjExercicios'),
    CJG("Antes de começar uma música, cante o refrão de cabeça. O andamento certo é o do refrão, não o da introdução.") ],
    q:[ Q("Onde é mais comum acelerar?",["Nas viradas e nos refrões","Nas partes calmas","Nas pausas"],0,"A empolgação empurra o andamento."),
        Q("Para que serve o metrônomo só no 2 e no 4?",["Para tocar mais rápido","Para você mesmo colocar o 1 e o 3 no lugar","Para descansar"],1,"Com menos ajuda, o pulso passa a vir de você.") ] } ]},

{ id:'cjm4', t:'Rudimentos', d:'As combinações de mãos que formam toda a técnica.', l:[
  { id:'cj4.1', t:'Toque simples e toque duplo', c:[
    "**Rudimentos** são as combinações básicas de mãos. Vêm da caixa da bateria e servem para qualquer tambor.",
    U(["**Toque simples**: um toque por mão, D E D E.","**Toque duplo**: dois toques por mão, D D E E."]),
    W('grade',{n:'Toque simples',p:'ffffffffffffffff',h:'DEDEDEDEDEDEDEDE',bpm:70}),
    W('grade',{n:'Toque duplo',p:'ffffffffffffffff',h:'DDEEDDEEDDEEDDEE',bpm:60}),
    "O objetivo é que os dois soem iguais: quem ouve de olhos fechados não deve saber qual é qual.",
    CJG("Cinco minutos de rudimentos por dia rendem mais do que meia hora uma vez por semana.") ],
    q:[ Q("Qual é a ordem das mãos no toque duplo?",["D E D E","D D E E","D E E D"],1,"Dois toques em cada mão."),
        Q("Qual é o objetivo ao estudar os dois?",["Que soem iguais","Que o duplo soe mais forte","Que o simples seja mais lento"],0,"Volume e tempo iguais, qualquer que seja a mão.") ] },
  { id:'cj4.2', t:'Paradiddle', c:[
    "O **paradiddle** junta os dois: dois toques simples e um duplo. D E D D, E D E E.",
    W('grade',{n:'Paradiddle simples',p:'AfffAfffAfffAfff',h:'DEDDEDEEDEDDEDEE',bpm:60}),
    "A cada grupo de quatro notas, a mão que começa troca. Isso permite acentuar ora com uma, ora com outra, sem quebrar o fluxo.",
    "Aplicado ao cajon, o acento da direita pode ir para o grave e o da esquerda ficar no agudo. O rudimento vira levada:",
    W('grade',{n:'Paradiddle como levada',p:'GfffAfffGfffAfff',h:'DEDDEDEEDEDDEDEE',bpm:60}),
    CJG("Todo rudimento novo passa por três fases: devagar dizendo as mãos, no metrônomo sem dizer, e por último dentro de uma levada.") ],
    q:[ Q("Qual é a ordem das mãos do paradiddle?",["D E D D, E D E E","D D E E","D E D E"],0,"Dois simples e um duplo, e depois o espelho."),
        Q("O que o paradiddle permite fazer?",["Tocar mais forte","Trocar a mão que lidera sem quebrar o fluxo","Tocar sem metrônomo"],1,"A cada quatro notas a mão do acento se inverte.") ] },
  { id:'cj4.3', t:'Acentos e controle', c:[
    "Controlar o acento é conseguir pôr uma nota forte em qualquer lugar, com qualquer mão, sem que as vizinhas subam junto.",
    W('grade',{n:'Acento na segunda semicolcheia',p:'fAfffAfffAfffAff',h:'DEDEDEDEDEDEDEDE',bpm:66}),
    U(["A mão que vai acentuar sobe **antes** do acento, durante a nota anterior.","Depois do acento, ela para baixo, pronta para o fantasma seguinte.","Esse sobe e desce é o que cansa no começo. Com o tempo fica automático."]),
    "Acentos fora do tempo são a base das viradas e das levadas sincopadas.",
    W('abrirCjExercicios'),
    CJG("O exercício “Acento que anda” passa o acento pelas quatro posições do tempo. É dos mais úteis de toda a lista.") ],
    q:[ Q("Quando a mão que vai acentuar deve subir?",["Depois do acento","Antes, durante a nota anterior","Tanto faz"],1,"A preparação vem antes."),
        Q("O que deve acontecer com as notas vizinhas do acento?",["Continuar baixas","Subir junto","Sumir"],0,"O contraste é que faz o acento.") ] },
  { id:'cj4.4', t:'Flam e rulo de dedos', c:[
    "Dois enfeites que aparecem bastante no cajon.",
    U(["**Flam**: as duas mãos tocam quase juntas, uma um instante antes e mais fraca. O resultado é uma nota só, mais gorda. Bom para reforçar um acento.","**Rulo de dedos**: os dedos caem um depois do outro, do mindinho ao indicador, como quem tamborila na mesa. Serve de preparação para um acento ou de preenchimento rápido."]),
    "Os dois são tempero. Use em pontos específicos: a entrada do refrão, o fim de uma frase.",
    "Estude primeiro bem devagar, fora de qualquer levada, até o som sair igual todas as vezes. Só então encaixe no fim de um compasso.",
    CJG("No flam, a nota fraca vem de perto da tampa e a forte vem de cima. Se as duas saírem da mesma altura, viram duas notas em vez de uma.") ],
    q:[ Q("O que é um flam?",["Dois toques quase juntos que soam como uma nota mais cheia","Um toque só de grave","Uma pausa"],0,"Uma nota de enfeite colada na principal."),
        Q("Como usar flam e rulo?",["O tempo todo","Em pontos específicos, como tempero","Só no grave"],1,"Enfeite demais vira ruído.") ] } ]},

{ id:'cjm5', t:'Forma e arranjo', d:'Saber onde você está na música e o que fazer em cada parte.', l:[
  { id:'cj5.1', t:'As partes da música', c:[
    "Quase toda canção é feita de blocos que se repetem. Conhecer os blocos é o que permite tocar sem partitura.",
    U(["**Introdução**: prepara o clima, muitas vezes sem percussão.","**Verso**: conta a história. Em geral mais baixo.","**Pré-refrão**: cria expectativa.","**Refrão**: o ponto alto, o trecho que todo mundo canta.","**Ponte**: uma parte diferente, perto do fim, que quebra a repetição.","**Solo** e **final**."]),
    "Os blocos costumam ter **4, 8 ou 16 compassos**. Conte em frases de quatro: é raro uma parte ter cinco ou sete.",
    {mono:"Intro 4 | Verso 8 | Refrão 8 | Verso 8 | Refrão 8 | Ponte 4 | Refrão 8 + 8 | Final"},
    CJG("Na ficha de cada música, na aba Músicas, há um campo de roteiro. Escreva a forma nele, como no exemplo acima.") ],
    q:[ Q("Quantos compassos as partes de uma canção costumam ter?",["4, 8 ou 16","5 ou 7","Sempre 12"],0,"Frases de quatro compassos e seus múltiplos."),
        Q("Qual parte é normalmente o ponto alto?",["O verso","A introdução","O refrão"],2,"É onde a levada fica mais cheia.") ] },
  { id:'cj5.2', t:'Viradas', c:[
    "**Virada** é uma frase curta que avisa que a música vai mudar de parte. Ela é pontuação: uma vírgula ou um ponto final.",
    W('grade',{n:'Três compassos de levada e virada de um tempo',p:'G...A...G.G.A...|G...A...G.G.A...|G...A...G.G.A...|G...A...G.G.AAAA',bpm:85}),
    U(["A virada acontece no **fim** da frase, no último compasso antes da mudança.","Pode durar um tempo, dois tempos ou o compasso inteiro. Quanto maior a mudança, maior a virada.","O que vem depois importa mais que a virada: cair no tempo 1, com grave, no andamento."]),
    "Uma virada simples no lugar certo soa melhor que uma complicada fora do tempo.",
    CJG("Tenha três viradas prontas, de tamanhos diferentes, e use só elas por um tempo. Repertório pequeno e seguro vale mais que improviso inseguro.") ],
    q:[ Q("Onde entra a virada?",["No começo da frase","No fim da frase, antes da mudança","No meio do verso"],1,"Ela prepara a parte seguinte."),
        Q("O que é mais importante numa virada?",["Ser rápida","Cair no tempo 1 depois dela","Usar todos os sons"],1,"A volta no tempo é o que a banda precisa.") ] },
  { id:'cj5.3', t:'Dinâmica por partes', c:[
    "A mesma levada do começo ao fim cansa quem ouve. O arranjo do cajon acompanha a história da música.",
    U(["**Introdução e primeiro verso**: pouco. Às vezes nada, ou só grave no tempo 1.","**Segundo verso**: a levada com colcheias, em volume baixo.","**Refrão**: levada cheia, mais volume.","**Ponte**: meio tempo, ou só fantasmas.","**Último refrão**: o ponto mais forte."]),
    W('grade',{n:'Verso',p:'G.f.A.f.G.f.A.f.',bpm:80}),
    W('grade',{n:'Refrão',p:'GfffAfffGfGfAfff',bpm:80}),
    "Entrar depois da banda é um recurso forte. Uma música que começa sem percussão ganha muito quando o cajon chega no segundo verso.",
    CJG("Guarde alguma coisa para o fim. Se o primeiro refrão já está no máximo, o último não tem para onde ir.") ],
    q:[ Q("Onde a levada costuma ficar mais cheia?",["No verso","No refrão","Na introdução"],1,"O refrão é o ponto alto."),
        Q("Por que não começar no volume máximo?",["Porque cansa a mão","Porque não sobra para onde crescer","Porque desafina"],1,"A música precisa de caminho para crescer.") ] },
  { id:'cj5.4', t:'Paradas, convenções e finais', c:[

/* ---------- repertório: apresentações (missas, bandas, canjas) com as músicas de gaita e de cajon ----------
   Importador em texto:
   Texto: a primeira linha de cada bloco é o nome do repertório; depois, uma música por linha.
   O instrumento vai entre parênteses no fim da linha: (gaita), (cajon), (gaita e cajon), (cromática), (gaita A).
   Blocos separados por linha em branco viram repertórios diferentes. */
function repNorm(s){ return cjNorm(s).replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/[^a-z0-9]+/g,' ').trim(); }
/* lê o conteúdo de um parêntese; devolve {ins,harp} se for marcação de instrumento, senão null */
function repTag(inner){
  var s=cjNorm(inner).replace(/[,+\/&]/g,' ').replace(/\s+/g,' ').trim(); if(!s) return null;
  var c=/\bcajon\b/.test(s), both=/\b(os dois|ambos|as duas)\b/.test(s), crom=/\bcrom/.test(s), g=crom || /\b(gaita|harmonica|diatonica|diat)\b/.test(s);
  if(!c && !g && !both) return null;
  var harp=crom?{type:'crom'}:null, m=/\b(?:gaita|harmonica|diatonica|diat)\s+(?:em\s+|de\s+)?([a-g](?:b|#)?)(?!\s+cajon)(?=\s|$)/.exec(s);
  if(m){ if(!harp){ var pn=C.parseNoteName(m[1].charAt(0).toUpperCase()+m[1].slice(1)); if(pn) harp={type:'diat',key:pn.pc}; } s=s.slice(0,m.index)+' gaita '+s.slice(m.index+m[0].length); }
  var rest=s.replace(/\b(cajon|os dois|ambos|as duas|cromatica|crom|gaita|harmonica|diatonica|diat|e|em|de|na|no|c)\b/g,' ').trim();
  if(rest) return null;
  return { ins:(both||(c&&g))?'gc':c?'c':'g', harp:harp };
}
function repTagText(ins, harp){ var g=harp?(harp.type==='crom'?'cromática':'gaita '+HARP_KEYS[harp.key]):'gaita'; return ins==='c'?'(cajon)':ins==='g'?'('+g+')':'('+g+' e cajon)'; }
/* separa a marcação do resto da linha */
function repSplitLine(line){
  var s=String(line), tag=null, m=/\s*[\(\[]([^\)\]]*)[\)\]]\s*$/.exec(s);
  if(m){ var t=repTag(m[1]); if(t){ tag=t; s=s.slice(0,m.index); } }
  if(!tag){ m=/^\s*[\(\[]([^\)\]]*)[\)\]]\s*/.exec(s); if(m){ var t2=repTag(m[1]); if(t2){ tag=t2; s=s.slice(m[0].length); } } }
  return { base:s.replace(/\s+$/,''), tag:tag };
}
function repParse(text){
  var blocks=[], cur=null;
  String(text||'').split('\n').forEach(function(raw,i){
    var line=raw.replace(/\r/g,''); if(!line.trim() || /^[\s\-=_*#]+$/.test(line)){ cur=null; return; }
    if(/^\s*(#|\/\/)/.test(line)) return;
    var sp=repSplitLine(line), body=sp.base.replace(/^\s*(?:\d{1,3}\s*[.)\-:]\s+|[-•*]\s+)/,'').trim();
    if(!cur){ cur={ name:'', line:-1, items:[] }; blocks.push(cur); if(!sp.tag){ cur.name=body.replace(/[:：]\s*$/,''); cur.line=i; return; } }
    if(!body) return;
    var parts=body.split(/\s+[-–—]\s+/), t=parts.shift().trim(), a=parts.join(' - ').trim();
    cur.items.push({ line:i, t:t, a:a, ins:sp.tag?sp.tag.ins:'', harp:sp.tag?sp.tag.harp:null });
  });
  var d=new Date(), dd=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
  blocks.forEach(function(b){ if(!b.name) b.name='Importado em '+dd; });
  return blocks.filter(function(b){ return b.items.length; });
}
function repSetIns(text, lineIdx, ins){ var ls=String(text||'').split('\n'), sp=repSplitLine(ls[lineIdx]||''); ls[lineIdx]=sp.base+' '+repTagText(ins, ins==='c'?null:(sp.tag?sp.tag.harp:null)); return ls.join('\n'); }
function repFindG(t){ var k=repNorm(t), r=null; if(k) S.songs.forEach(function(s){ if(!r && repNorm(s.title)===k) r=s; }); return r; }
function repFindC(t){ var k=repNorm(t), r=null; if(k) S.cjSongs.forEach(function(s){ if(!r && repNorm(s.t)===k) r=s; }); return r; }
function repById(id){ var r=null; (S.reps||[]).forEach(function(x){ if(x.id===id) r=x; }); return r; }
function repHas(rep, kind){ return rep.items.some(function(it){ return it.ins.indexOf(kind)>=0; }); }
/* músicas do repertório para um instrumento, na ordem do repertório */
function repSongs(rep, kind){ var out=[]; rep.items.forEach(function(it){ if(it.ins.indexOf(kind)<0) return; var s=kind==='g'?repFindG(it.t):repFindC(it.t); if(s && out.indexOf(s)<0) out.push(s); }); return out; }
function repText(rep){ return [rep.name].concat(rep.items.map(function(it){ return it.t+(it.a?' - '+it.a:'')+' '+repTagText(it.ins, it.h||null); })).join('\n'); }
var REP_KINDS=[['missa','Missa'],['banda','Banda ou canja'],['outro','Outra']];
var REP_ST=['a tirar','praticando','pronta'], REP_DOW=['dom','seg','ter','qua','qui','sex','sáb'], REP_MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function repDefIns(){ var d=S.imp.def; return (d==='g'||d==='c'||d==='gc') ? d : 'g'; }
function gSt(s){ return REP_ST.indexOf(s.st)>=0 ? s.st : (String(s.text||'').trim()?'praticando':'a tirar'); }
function repToday(){ var t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function repIso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function repDate(r){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(r.date||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function repDays(r){ var d=repDate(r); return d?Math.round((d-repToday())/864e5):null; }
function repWhen(n){ return n===0?'hoje':n===1?'amanhã':n===-1?'ontem':n>0?'em '+n+' dias':'há '+(-n)+' dias'; }
function repDm(d){ return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2); }
function repKind(r){ var k=''; REP_KINDS.forEach(function(x){ if(x[0]===r.kind) k=x[1]; }); return k; }
/* data escrita no nome ("Missa 12/10"): sem ano, vale a próxima ocorrência */
function repGuessDate(name){ var m=/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/.exec(String(name||'')); if(!m) return '';
  var dd=+m[1], mm=+m[2], t=repToday(), y=m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):t.getFullYear(); if(dd<1||dd>31||mm<1||mm>12) return '';
  var d=new Date(y,mm-1,dd); if(d.getMonth()!==mm-1) return ''; if(!m[3] && (t-d)/864e5>30) d=new Date(y+1,mm-1,dd); return repIso(d); }
function repGuessKind(name){ var n=cjNorm(name); return /\bmissa\b|celebrac|igreja|paroquia/.test(n)?'missa':/\b(banda|canja|show|ensaio|bar|festa|jam)\b/.test(n)?'banda':''; }
function repUpcoming(r){ var n=repDays(r); return n==null || n>=0; }
function repSorted(up){ return (S.reps||[]).filter(function(r){ return repUpcoming(r)===up; }).sort(function(a,b){ var da=repDays(a), db=repDays(b); if(da==null&&db==null) return (b.u||0)-(a.u||0); if(da==null) return 1; if(db==null) return -1; return up?da-db:db-da; }); }
/* cada música em cada instrumento, com a situação que está na lista do instrumento */
function repPairs(r){ var out=[]; r.items.forEach(function(it){ ['g','c'].forEach(function(k){ if(it.ins.indexOf(k)<0) return; var s=k==='g'?repFindG(it.t):repFindC(it.t); out.push({ it:it, k:k, song:s, st:s?(k==='g'?gSt(s):(REP_ST.indexOf(s.st)>=0?s.st:'a tirar')):null }); }); }); return out; }
function repProgress(r){ var p=repPairs(r); return { n:p.length, ok:p.filter(function(x){ return x.st==='pronta'; }).length }; }
/* garante que a música existe na lista de cada instrumento marcado */
function repEnsure(rep, it, res){
