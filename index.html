function icon(name){ var s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','ic'); s.setAttribute('aria-hidden','true'); s.innerHTML=ICON[name]; return s; }
var TABS=[['gaita','Gaita'],['escalas','Escalas'],['exercicios','Exercícios'],['musicas','Músicas'],['caderno','Anotações'],['transpor','Transpor'],['teoria','Teoria']];
var VIEWS={ gaita:viewGaita, escalas:viewEscalas, exercicios:viewExercicios, musicas:viewMusicas, caderno:viewCaderno, cajon:viewCajon, transpor:viewTranspor, teoria:viewTeoria, metronomo:viewMetronomo, ajustes:viewAjustes };
function isAux(t){ return t==='metronomo' || t==='ajustes' || t==='cajon'; }
function openAux(name){ if(S.tab===name){ S.tab=(S.back && S.back!==name)?S.back:'gaita'; } else { if(!isAux(S.tab) || (S.tab==='cajon' && name!=='cajon')) S.back=S.tab; S.tab=name; } save(); stopPlay(); render(); window.scrollTo(0,0); }
function goCajon(){ if(S.tab!=='cajon'){ if(!isAux(S.tab)) S.gback=S.tab; S.back='cajon'; S.tab='cajon'; save(); stopPlay(); render(); window.scrollTo(0,0); } }
function goGaita(){ if(S.tab==='cajon' || S.back==='cajon'){ S.tab=S.gback||'gaita'; S.back=S.tab; save(); stopPlay(); render(); window.scrollTo(0,0); } }
function render(keepFocus){
  cleanup.forEach(function(f){ try{ f(); }catch(e){} }); cleanup=[];
  var act=document.activeElement, fid=act&&act.id, ss=act&&act.selectionStart, y=window.scrollY;
  var cj=S.tab==='cajon' || (S.back==='cajon' && (S.tab==='metronomo'||S.tab==='ajustes'));
  if(cj) document.documentElement.setAttribute('data-skin','cajon'); else document.documentElement.removeAttribute('data-skin');
  var hb=document.getElementById('harpbar'); hb.textContent='';
  hb.appendChild(el('div',{class:'ins',role:'group','aria-label':'Instrumento'},[
    el('button',{type:'button',id:'insGaita','aria-pressed':cj?'false':'true',text:'Gaita',onclick:goGaita}),
    el('button',{type:'button',id:'insCajon','aria-pressed':cj?'true':'false',text:'Cajon',onclick:goCajon})]));
  if(!cj){
  var mineHas=S.mine.some(function(m){ return sameHarp(m,S.harp); });
  var pick=function(h){ S.harp=h; if(S.sc.pos===0 && h.type==='diat') S.sc.pos=1; S.ex=null; save(); render(); };
  S.mine.concat(mineHas?[]:[S.harp]).forEach(function(h){ hb.appendChild(chip(h.type==='crom'?'Cromática':NN(HARP_KEYS[h.key]), sameHarp(h,S.harp), function(){ pick(h); },'hp')); });
  var os=harpSelect(S.harp,pick,'harpOther'); os.setAttribute('aria-label','Escolher outra gaita'); hb.appendChild(os);
  }
  ['tabs','tabsBottom'].forEach(function(id){ var tb=document.getElementById(id); tb.textContent='';
    TABS.forEach(function(t){ tb.appendChild(el('button',{type:'button',role:'tab','aria-selected':S.tab===t[0]?'true':'false',onclick:function(){ S.tab=t[0]; S.back=t[0]; save(); stopPlay(); render(); window.scrollTo(0,0); try{ history.replaceState(null,'','#'+t[0]); }catch(e){} }},[icon(t[0]),el('span',{text:t[1]})])); }); });
  document.getElementById('cfgBtn').setAttribute('aria-pressed',S.tab==='ajustes'?'true':'false');

}
function init(){
  var h=(location.hash||'').replace('#',''); if(VIEWS[h]) S.tab=h; if(!VIEWS[S.tab]) S.tab='gaita';
  var mm=document.getElementById('mm');
  mm.querySelector('button').addEventListener('click',function(){ Metro.toggle(); if(S.tab==='metronomo') render(); });
  mm.querySelector('.mm-open').addEventListener('click',function(){ openAux('metronomo'); });
  if(!S.cjSongs) S.cjSongs=cjSeedSongs(); if(!S.cjEx) S.cjEx=cjSeedEx();
  var cfg=document.getElementById('cfgBtn'); cfg.appendChild(icon('ajustes')); cfg.addEventListener('click',function(){ openAux('ajustes'); });
  var sb=document.getElementById('syncBtn'); sb.appendChild(icon('nuvem')); sb.addEventListener('click',function(){ if(Sync.on()) Sync.run(true); else openAux('ajustes'); });
  render();
  if(Sync.on()){ Sync.st='ok'; Sync.run(); }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && Sync.on() && Date.now()-(S.sync.last||0)>30000) Sync.run(); });
}
window.__gaita={ S:S, Mic:Mic, Metro:Metro, Sync:Sync, render:render, mergeDoc:mergeDoc, syncDoc:syncDoc, importCaderno:importCaderno };
